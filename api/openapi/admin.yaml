openapi: 3.1.0
info:
  title: Aera Admin Browser API
  version: 0.2.0
  description: |
    公司内部 Aera Admin 一期安全控制台 API。契约覆盖独立管理员身份、强制 TOTP、
    会话、激活、固定角色管理，以及 Aera Admin 对外部 Aera Cloud Internal Admin API
    的安全消费边界；真实 Cloud 服务端实现仍归属独立的 aera-cloud 仓库。

    所有浏览器请求同源发送且响应均为 `Cache-Control: no-store`。除 GET/HEAD/OPTIONS
    外，服务端还会校验精确 Origin；已认证的写请求同时要求内存中的 CSRF 值。
servers:
  - url: /api/v1
    description: 与 Aera Admin SPA 同源
tags:
  - name: Authentication
  - name: Activation
  - name: Administrators
  - name: CloudUsers
  - name: CloudDevices
  - name: Approvals
  - name: Operations
  - name: Audit
  - name: Settings
  - name: System

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: 验证独立管理员邮箱和密码
      description: 成功只返回短期登录挑战，不创建会话 Cookie。
      operationId: beginAdministratorLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 密码验证成功，必须继续完成 TOTP 或恢复码验证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginChallenge'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/totp/verify:
    post:
      tags: [Authentication]
      summary: 完成管理员双因素登录
      description: "`totp_code` 与 `recovery_code` 必须且只能提供一个；成功设置 HttpOnly 会话 Cookie。"
      operationId: completeAdministratorLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/SessionEstablished'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/step-up:
    post:
      tags: [Authentication]
      summary: 刷新高风险操作所需的近期 TOTP 状态
      operationId: stepUpAdministratorSession
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: TOTP Step-up 成功；会话建立方式保持不变
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDocument'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/StepUpUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: 撤销当前管理员会话
      operationId: logoutAdministrator
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 当前会话已撤销并清除 Cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusDocument'
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /me:
    get:
      tags: [Authentication]
      summary: 获取当前管理员会话并重新签发内存 CSRF 值
      operationId: getAdministratorSession
      security:
        - adminSession: []
      responses:
        '200':
          description: 当前有效会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDocument'
        '401': { $ref: '#/components/responses/AuthRequired' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/activation/prepare:
    post:
      tags: [Activation]
      summary: 验证一次性激活令牌并取得 TOTP 配置 URI
      description: 原始令牌来自 `/activate#token=...` Fragment，浏览器读取并清除 Fragment 后才调用此接口。
      operationId: prepareAdministratorActivation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationTokenRequest'
      responses:
        '200':
          description: 激活上下文和一次性 TOTP 配置 URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationPreparation'
        '400': { $ref: '#/components/responses/ActivationInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /auth/activate:
    post:
      tags: [Activation]
      summary: 激活管理员凭证或完成 TOTP 重置
      description: 成功后恢复码只返回这一次；此接口不会创建登录会话。
      operationId: activateAdministrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          description: 激活完成与一次性恢复码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResult'
        '400': { $ref: '#/components/responses/ActivationInvalid' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users:
    get:
      tags: [Administrators]
      summary: 列出脱敏内部管理员
      operationId: listAdministrators
      security:
        - adminSession: []
      responses:
        '200':
          description: 管理员列表；不包含完整邮箱或凭证材料
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Administrator'
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users/invitations:
    post:
      tags: [Administrators]
      summary: 邀请固定角色的内部管理员
      description: 需要 `administrator.manage` 和 10 分钟内的 TOTP Step-up。
      operationId: inviteAdministrator
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAdministratorRequest'
      responses:
        '201':
          description: 邀请已创建；完整激活链接只返回这一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users/{adminID}/role:
    put:
      tags: [Administrators]
      summary: 调整内部管理员固定角色
      operationId: changeAdministratorRole
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role, reason_code]
              properties:
                role: { $ref: '#/components/schemas/AdminRole' }
                reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
                ticket_reference: { type: string, maxLength: 120 }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/StatusOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AdministratorNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users/{adminID}/suspend:
    post:
      tags: [Administrators]
      summary: 暂停内部管理员并撤销其会话
      operationId: suspendAdministrator
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionReason'
      responses:
        '200': { $ref: '#/components/responses/StatusOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AdministratorNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users/{adminID}/sessions/revoke:
    post:
      tags: [Administrators]
      summary: 撤销目标管理员的全部当前会话
      description: |
        需要 `administrator.manage` 和 10 分钟内的 TOTP Step-up。账号保持有效，目标管理员可以重新登录；
        当目标已无有效会话时返回成功，且不会再次增加安全版本或重复写入审计事件。
      operationId: revokeAdministratorSessions
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionReason'
      responses:
        '200': { $ref: '#/components/responses/StatusOK' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AdministratorNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /admin-users/{adminID}/totp/reset:
    post:
      tags: [Administrators]
      summary: 撤销目标会话并生成一次性 TOTP 重绑定链接
      operationId: resetAdministratorTOTP
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/AdminID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionReason'
      responses:
        '201':
          description: 重绑定邀请已创建；完整链接只返回这一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/AdministratorNotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/AuthUnavailable' }

  /cloud-users:
    get:
      tags: [CloudUsers]
      summary: 分页列出脱敏 Cloud 用户
      operationId: listCloudUsers
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/UserStatus'
      responses:
        '200': { $ref: '#/components/responses/CloudUserPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-users/lookup:
    post:
      tags: [CloudUsers]
      summary: 按完整邮箱或手机号精确定位 Cloud 用户
      description: 完整身份仅存在于本次请求体和到 Cloud 的单次调用边界；响应、日志与审计均保持脱敏。
      operationId: lookupCloudUser
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityLookupRequest'
      responses:
        '200': { $ref: '#/components/responses/CloudUser' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-users/{userID}:
    get:
      tags: [CloudUsers]
      summary: 获取一个脱敏 Cloud 用户
      operationId: getCloudUser
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/UserID'
      responses:
        '200': { $ref: '#/components/responses/CloudUser' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-users/{userID}/devices:
    get:
      tags: [CloudDevices]
      summary: 分页列出用户设备
      operationId: listCloudUserDevices
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/CloudDevicePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-users/{userID}/sessions:
    get:
      tags: [CloudDevices]
      summary: 分页列出用户 Cloud 会话
      operationId: listCloudUserSessions
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/UserID'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/CloudSessionPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-devices/{deviceID}/revoke:
    post:
      tags: [CloudDevices]
      summary: 撤销一个 Cloud 设备
      operationId: revokeCloudDevice
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/DeviceID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CloudMutation'
      responses:
        '202': { $ref: '#/components/responses/AdminOperation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /cloud-sessions/{sessionID}/revoke:
    post:
      tags: [CloudDevices]
      summary: 撤销一个 Cloud 会话
      operationId: revokeCloudSession
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/SessionID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CloudMutation'
      responses:
        '202': { $ref: '#/components/responses/AdminOperation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approval-requests:
    get:
      tags: [Approvals]
      summary: 分页列出当前角色可见的审批申请
      operationId: listApprovalRequests
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ApprovalView'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ApprovalPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Approvals]
      summary: 发起账号停用或恢复审批
      operationId: createApprovalRequest
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequest'
      responses:
        '201': { $ref: '#/components/responses/ApprovalRequest' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '502': { $ref: '#/components/responses/CloudUnavailable' }
        '503': { $ref: '#/components/responses/CloudUnavailable' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approval-requests/{approvalID}:
    get:
      tags: [Approvals]
      summary: 获取审批详情及不可变事件时间线
      operationId: getApprovalRequest
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequest' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approval-requests/{approvalID}/approve:
    post:
      tags: [Approvals]
      summary: 由不同的超级管理员批准申请
      operationId: approveApprovalRequest
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/EmptyJSON'
      responses:
        '202': { $ref: '#/components/responses/ApprovalRequest' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approval-requests/{approvalID}/reject:
    post:
      tags: [Approvals]
      summary: 由不同的超级管理员拒绝申请
      operationId: rejectApprovalRequest
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      requestBody:
        $ref: '#/components/requestBodies/EmptyJSON'
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequest' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /approval-requests/{approvalID}/cancel:
    post:
      tags: [Approvals]
      summary: 由发起人取消待审申请
      operationId: cancelApprovalRequest
      description: Requires a TOTP Step-up completed within the last 10 minutes.
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ApprovalID'
      requestBody:
        $ref: '#/components/requestBodies/EmptyJSON'
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequest' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /operations/{operationID}:
    get:
      tags: [Operations]
      summary: 查询管理员操作的可靠执行状态
      operationId: getAdminOperation
      security:
        - adminSession: []
      parameters:
        - $ref: '#/components/parameters/OperationID'
      responses:
        '200': { $ref: '#/components/responses/AdminOperation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /audit-events:
    get:
      tags: [Audit]
      summary: 按当前管理员的数据范围查询不可变审计记录
      description: |
        超级管理员和审计员可查询全部记录；运营和客服角色由服务端强制限定为本人记录。
        响应只包含安全投影，不返回来源 IP 摘要、User-Agent 或哈希链字段。
      operationId: listAuditEvents
      security:
        - adminSession: []
      parameters:
        - name: cursor
          in: query
          schema: { type: string, maxLength: 512 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: actor_admin_id
          in: query
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,99}$' }
        - name: object_type
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_.]{0,99}$' }
        - name: object_id
          in: query
          schema: { type: string, format: uuid }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: reason_code
          in: query
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/AuditEventPage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/AuditUnavailable' }

  /system/settings:
    get:
      tags: [Settings]
      summary: 获取管理员会话策略与审计保留策略
      description: 需要 `system_settings.read`；固定授予超级管理员和审计员。
      operationId: getSystemSettings
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/SecurityPolicy' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SettingsUnavailable' }

  /system/settings/security-policy:
    put:
      tags: [Settings]
      summary: 更新管理员会话策略与审计保留策略
      description: |
        需要 `system_settings.manage`、10 分钟内由 TOTP 建立的 Step-up、同源 Origin、
        CSRF 和 Idempotency-Key。会话时长发生变化时撤销包括调用者在内的全部管理员会话。
      operationId: updateSystemSecurityPolicy
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSecurityPolicyRequest' }
      responses:
        '200': { $ref: '#/components/responses/SecurityPolicyMutation' }
        '400': { $ref: '#/components/responses/SettingsPolicyInvalid' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SettingsConflict' }
        '503': { $ref: '#/components/responses/SettingsUnavailable' }

  /system/reason-codes:
    get:
      tags: [Settings]
      summary: 获取标准原因码目录
      description: |
        任意已认证管理员可按一个 `usage` 获取该操作允许使用的有效原因码。
        只有 `system_settings.read` 可按分类或全量读取，并可包含已停用原因码。
        `usage` 与 `category` 互斥；`usage` 不允许与 `include_inactive=true` 同时使用。
      operationId: listSystemReasonCodes
      security:
        - adminSession: []
      parameters:
        - name: usage
          in: query
          schema: { $ref: '#/components/schemas/ReasonUsage' }
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ReasonCategory' }
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/ReasonCodePage' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/SettingsUnavailable' }
    post:
      tags: [Settings]
      summary: 创建标准原因码
      description: 需要 `system_settings.manage`、10 分钟内 TOTP Step-up、同源 Origin、CSRF 和幂等键。
      operationId: createSystemReasonCode
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReasonCodeRequest' }
      responses:
        '201': { $ref: '#/components/responses/ReasonCodeMutation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/SettingsConflict' }
        '503': { $ref: '#/components/responses/SettingsUnavailable' }

  /system/reason-codes/{code}:
    put:
      tags: [Settings]
      summary: 更新标准原因码标签或有效状态
      description: |
        需要 `system_settings.manage`、10 分钟内 TOTP Step-up、同源 Origin、CSRF 和幂等键。
        稳定 code 与 category 不可修改；受保护原因和分类中的最后一个有效原因不能停用。
      operationId: updateSystemReasonCode
      security:
        - adminSession: []
          csrfToken: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateReasonCodeRequest' }
      responses:
        '200': { $ref: '#/components/responses/ReasonCodeMutation' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ReasonCodeNotFound' }
        '409': { $ref: '#/components/responses/SettingsConflict' }
        '503': { $ref: '#/components/responses/SettingsUnavailable' }

  /system/health:
    get:
      tags: [System]
      summary: 获取不暴露内部地址或凭据的安全依赖健康状态
      operationId: getAdminSystemHealth
      security:
        - adminSession: []
      responses:
        '200': { $ref: '#/components/responses/SystemHealth' }
        '401': { $ref: '#/components/responses/AuthRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-aera_admin_session
      description: Secure、HttpOnly、SameSite=Strict 的管理员会话 Cookie。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: "`/me` 或会话建立响应返回，仅保存在页面内存中。"

  parameters:
    AdminID:
      name: adminID
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 512 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    UserStatus:
      name: status
      in: query
      schema: { $ref: '#/components/schemas/CloudUserStatus' }
    UserID:
      name: userID
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceID:
      name: deviceID
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionID:
      name: sessionID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalID:
      name: approvalID
      in: path
      required: true
      schema: { type: string, format: uuid }
    OperationID:
      name: operationID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ApprovalView:
      name: view
      in: query
      required: true
      schema: { type: string, enum: [pending_for_me, mine, all] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{15,127}$'

  requestBodies:
    CloudMutation:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudMutationRequest' }
    EmptyJSON:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false

  schemas:
    AdminRole:
      type: string
      enum: [super_admin, developer, operator, support, finance, auditor]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          writeOnly: true
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true

    LoginChallenge:
      type: object
      additionalProperties: false
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          x-sensitive: true
        expires_at:
          type: string
          format: date-time

    CompleteLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge_id, totp_code, recovery_code]
      properties:
        challenge_id:
          type: string
          writeOnly: true
        totp_code:
          type: string
          maxLength: 6
          writeOnly: true
        recovery_code:
          type: string
          maxLength: 128
          writeOnly: true
      oneOf:
        - properties:
            totp_code: { type: string, pattern: '^\d{6}$' }
            recovery_code: { type: string, maxLength: 0 }
        - properties:
            totp_code: { type: string, maxLength: 0 }
            recovery_code: { type: string, minLength: 1 }

    StepUpRequest:
      type: object
      additionalProperties: false
      required: [totp_code]
      properties:
        totp_code:
          type: string
          pattern: '^\d{6}$'
          writeOnly: true

    AdministratorPrincipal:
      type: object
      additionalProperties: false
      required:
        - admin_id
        - session_id
        - role
        - security_version
        - mfa_authenticated_at
        - totp_authenticated_at
        - mfa_method
      properties:
        admin_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/AdminRole' }
        security_version: { type: integer, format: int64, minimum: 1 }
        mfa_authenticated_at: { type: string, format: date-time }
        totp_authenticated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        mfa_method:
          type: string
          enum: [totp, recovery]

    SessionDocument:
      type: object
      additionalProperties: false
      required: [csrf_token, administrator, display_name, absolute_expires_at]
      properties:
        csrf_token:
          type: string
          x-sensitive: true
          description: 仅驻留页面内存，不写入 Web Storage。
        administrator:
          $ref: '#/components/schemas/AdministratorPrincipal'
        display_name:
          type: string
        absolute_expires_at:
          type: string
          format: date-time

    ActivationTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          maxLength: 128
          writeOnly: true

    ActivationPreparation:
      type: object
      additionalProperties: false
      required: [admin_id, display_name, masked_identity, purpose, provisioning_uri, expires_at]
      properties:
        admin_id: { type: string, format: uuid }
        display_name: { type: string }
        masked_identity:
          type: string
          description: 后端生成的脱敏身份，例如 `a***@example.com`。
        purpose:
          type: string
          enum: [activation, totp_reset]
        provisioning_uri:
          type: string
          x-sensitive: true
          description: 只用于本页 QR 渲染，不显示密钥文本且离页后清除内存缓存。
        expires_at: { type: string, format: date-time }

    ActivateRequest:
      type: object
      additionalProperties: false
      required: [token, password, totp_code]
      properties:
        token: { type: string, maxLength: 128, writeOnly: true }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        totp_code: { type: string, pattern: '^\d{6}$', writeOnly: true }

    ActivationResult:
      type: object
      additionalProperties: false
      required: [admin_id, recovery_codes]
      properties:
        admin_id: { type: string, format: uuid }
        recovery_codes:
          type: array
          minItems: 8
          maxItems: 8
          items: { type: string, x-sensitive: true }
          description: 只返回和展示一次。

    Administrator:
      type: object
      additionalProperties: false
      required:
        - id
        - masked_identity
        - display_name
        - role
        - status
        - mfa_enabled
        - security_version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        masked_identity:
          type: string
          description: 后端脱敏身份，不得包含完整邮箱或手机号。
        display_name: { type: string }
        role: { $ref: '#/components/schemas/AdminRole' }
        status:
          type: string
          enum: [invited, active, suspended]
        mfa_enabled: { type: boolean }
        security_version: { type: integer, format: int64, minimum: 1 }
        last_login_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ActionReason:
      type: object
      additionalProperties: false
      required: [reason_code]
      properties:
        reason_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{2,63}$'
        ticket_reference:
          type: string
          maxLength: 120
        note:
          type: string
          maxLength: 500

    InviteAdministratorRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, role, reason_code]
      properties:
        email: { type: string, format: email, maxLength: 254, writeOnly: true }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        role: { $ref: '#/components/schemas/AdminRole' }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 120 }
        note: { type: string, maxLength: 500 }

    InvitationResult:
      type: object
      additionalProperties: false
      required: [invitation_id, admin_id, activation_url, expires_at]
      properties:
        invitation_id: { type: string, format: uuid }
        admin_id: { type: string, format: uuid }
        activation_url:
          type: string
          format: uri
          x-sensitive: true
          description: 只返回和展示一次，令牌位于 URL Fragment。
        expires_at: { type: string, format: date-time }

    IdentityLookupRequest:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { type: string, enum: [email, phone] }
        value: { type: string, minLength: 3, maxLength: 320, writeOnly: true }

    CloudUserStatus:
      type: string
      enum: [active, pending_deletion, disabled]

    CloudUser:
      type: object
      additionalProperties: false
      required:
        - user_id
        - status
        - administratively_disabled
        - administrative_revision
        - device_count
        - active_device_count
        - active_session_count
        - created_at
      anyOf:
        - required: [masked_email]
        - required: [masked_phone]
      properties:
        user_id: { type: string, format: uuid }
        masked_email: { type: string, pattern: '^[^@* ]\*{3}@[A-Za-z0-9.-]+$' }
        masked_phone: { type: string, pattern: '^[0-9]{3}\*{4}[0-9]{4}$' }
        status: { $ref: '#/components/schemas/CloudUserStatus' }
        administratively_disabled: { type: boolean }
        deletion_finalized_at: { type: string, format: date-time }
        administrative_revision: { type: integer, format: int64, minimum: 1 }
        device_count: { type: integer, minimum: 0 }
        active_device_count: { type: integer, minimum: 0 }
        active_session_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_cloud_activity_at: { type: string, format: date-time }

    CloudDevice:
      type: object
      additionalProperties: false
      required: [device_id, user_id, display_name, platform, client_version, status]
      properties:
        device_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        platform: { type: string, minLength: 1, maxLength: 32 }
        client_version: { type: string, minLength: 1, maxLength: 64 }
        status: { type: string, enum: [active, inactive, revoked] }
        last_seen_at: { type: string, format: date-time }

    CloudSession:
      type: object
      additionalProperties: false
      required: [session_id, user_id, device_id, status, issued_at, expires_at]
      properties:
        session_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        status: { type: string, enum: [active, rotated, expired, revoked, replay_detected] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }

    CloudUserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CloudUser' }
        next_cursor: { type: string, maxLength: 512 }

    CloudDevicePage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CloudDevice' }
        next_cursor: { type: string, maxLength: 512 }

    CloudSessionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CloudSession' }
        next_cursor: { type: string, maxLength: 512 }

    CloudMutationRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, reason_code]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }

    CreateApprovalRequest:
      type: object
      additionalProperties: false
      required: [action, target_user_id, reason_code]
      properties:
        action: { type: string, enum: [disable_user, enable_user] }
        target_user_id: { type: string, format: uuid }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }

    OperationState:
      type: string
      enum: [queued, executing, reconciling, succeeded, failed, conflict]

    AdminOperation:
      type: object
      additionalProperties: false
      required: [operation_id, state, updated_at]
      properties:
        operation_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/OperationState' }
        error_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,99}$' }
        updated_at: { type: string, format: date-time }

    ApprovalEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, before_status, after_status, actor_admin_id, actor_role, request_id, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        before_status: { type: string }
        after_status: { type: string }
        result_code: { type: string, pattern: '^[A-Z][A-Z0-9_]{2,99}$' }
        actor_admin_id: { type: string, format: uuid }
        actor_role: { $ref: '#/components/schemas/AdminRole' }
        request_id: { type: string, maxLength: 128 }
        created_at: { type: string, format: date-time }

    ApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - action
        - target_user_id
        - target_snapshot
        - requested_by_admin_id
        - requested_by_role
        - reason_code
        - expected_revision
        - approval_status
        - execution_status
        - expires_at
        - created_at
        - updated_at
        - version
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [disable_user, enable_user] }
        target_user_id: { type: string, format: uuid }
        target_snapshot: { $ref: '#/components/schemas/CloudUser' }
        requested_by_admin_id: { type: string, format: uuid }
        requested_by_role: { type: string, const: operator }
        reviewed_by_admin_id: { type: string, format: uuid }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        approval_status: { type: string, enum: [pending_review, approved, rejected, expired, cancelled] }
        execution_status: { type: string, enum: [not_started, queued, executing, reconciling, succeeded, failed, conflict] }
        operation_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 1 }
        events:
          type: array
          items: { $ref: '#/components/schemas/ApprovalEvent' }

    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ApprovalRequest' }
        next_cursor: { type: string, maxLength: 512 }

    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - actor_admin_id
        - event_type
        - object_type
        - object_id
        - outcome
        - approval_id
        - operation_id
        - request_id
        - created_at
      properties:
        id: { type: string, format: uuid }
        actor_admin_id: { type: [string, 'null'], format: uuid }
        actor_role: { $ref: '#/components/schemas/AdminRole' }
        event_type: { type: string, pattern: '^[a-z][a-z0-9_.]{0,99}$' }
        object_type: { type: string, pattern: '^[a-z][a-z0-9_.]{0,99}$' }
        object_id: { type: [string, 'null'], format: uuid }
        outcome: { type: string, enum: [success, failure, denied] }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }
        approval_id: { type: [string, 'null'], format: uuid }
        operation_id: { type: [string, 'null'], format: uuid }
        error_code: { type: string, maxLength: 100 }
        before_state:
          type: object
          additionalProperties: { type: string }
        after_state:
          type: object
          additionalProperties: { type: string }
        request_id: { type: string, maxLength: 128 }
        created_at: { type: string, format: date-time }

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        next_cursor: { type: [string, 'null'], maxLength: 512 }

    SecurityPolicy:
      type: object
      additionalProperties: false
      required:
        - session_idle_minutes
        - session_absolute_hours
        - audit_retention_days
        - revision
        - updated_by_admin_id
        - updated_at
      properties:
        session_idle_minutes: { type: integer, minimum: 5, maximum: 120 }
        session_absolute_hours: { type: integer, minimum: 1, maximum: 24 }
        audit_retention_days: { type: integer, minimum: 365, maximum: 3650 }
        revision: { type: integer, format: int64, minimum: 1 }
        updated_by_admin_id: { type: [string, 'null'], format: uuid }
        updated_at: { type: string, format: date-time }

    UpdateSecurityPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
        - session_idle_minutes
        - session_absolute_hours
        - audit_retention_days
        - reason_code
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        session_idle_minutes: { type: integer, minimum: 5, maximum: 120 }
        session_absolute_hours: { type: integer, minimum: 1, maximum: 24 }
        audit_retention_days: { type: integer, minimum: 365, maximum: 3650 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }

    SecurityPolicyMutationResult:
      type: object
      additionalProperties: false
      required: [operation_id, policy, sessions_revoked]
      properties:
        operation_id: { type: string, format: uuid }
        policy: { $ref: '#/components/schemas/SecurityPolicy' }
        sessions_revoked: { type: boolean }

    ReasonCategory:
      type: string
      enum: [administrator, session, device, account, security]

    ReasonUsage:
      type: string
      enum: [administrator, account, device, session, settings]

    ReasonCode:
      type: object
      additionalProperties: false
      required: [code, category, label, active, revision, created_at, updated_at]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        category: { $ref: '#/components/schemas/ReasonCategory' }
        label: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ReasonCodePage:
      type: object
      additionalProperties: false
      required: [items, settings_revision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReasonCode' }
        settings_revision: { type: integer, format: int64, minimum: 1 }

    CreateReasonCodeRequest:
      type: object
      additionalProperties: false
      required: [code, category, label, expected_settings_revision, reason_code]
      properties:
        code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        category: { $ref: '#/components/schemas/ReasonCategory' }
        label: { type: string, minLength: 1, maxLength: 80 }
        expected_settings_revision: { type: integer, format: int64, minimum: 1 }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }

    UpdateReasonCodeRequest:
      type: object
      additionalProperties: false
      required: [expected_settings_revision, expected_reason_revision, label, active, reason_code]
      properties:
        expected_settings_revision: { type: integer, format: int64, minimum: 1 }
        expected_reason_revision: { type: integer, format: int64, minimum: 1 }
        label: { type: string, minLength: 1, maxLength: 80 }
        active: { type: boolean }
        reason_code: { type: string, pattern: '^[a-z][a-z0-9_]{2,63}$' }
        ticket_reference: { type: string, maxLength: 128 }
        note: { type: string, maxLength: 500 }

    ReasonCodeMutationResult:
      type: object
      additionalProperties: false
      required: [operation_id, reason, settings_revision]
      properties:
        operation_id: { type: string, format: uuid }
        reason: { $ref: '#/components/schemas/ReasonCode' }
        settings_revision: { type: integer, format: int64, minimum: 1 }

    SystemHealth:
      type: object
      additionalProperties: false
      required: [admin, postgres, redis, cloud]
      properties:
        admin: { type: string, const: ok }
        postgres: { type: string, enum: [ok, unavailable] }
        redis: { type: string, enum: [ok, unavailable] }
        cloud: { $ref: '#/components/schemas/CloudHealth' }

    CloudHealth:
      type: object
      additionalProperties: false
      required: [configured, availability, mtls, service_jwt, upstream, checked_at]
      properties:
        configured: { type: boolean }
        availability: { type: string, enum: [not_configured, available, unavailable, contract_error] }
        mtls: { type: string, enum: [not_checked, ok, unavailable, contract_error] }
        service_jwt: { type: string, enum: [not_checked, ok, unavailable, contract_error] }
        upstream: { type: string, enum: [not_checked, ok, unavailable, contract_error] }
        checked_at: { type: string, format: date-time }

    CloudControlErrorDocument:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - CLOUD_NOT_CONFIGURED
                - CLOUD_UNAVAILABLE
                - CLOUD_CONTRACT_VIOLATION
                - IDEMPOTENCY_KEY_REUSED
                - APPROVAL_EXPIRED
                - APPROVAL_SELF_REVIEW_FORBIDDEN
                - APPROVAL_STATE_CONFLICT
                - OPERATION_RECONCILING
            message: { type: string }

    SettingsErrorDocument:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - SETTINGS_POLICY_INVALID
                - SETTINGS_REVISION_CONFLICT
                - REASON_CODE_ALREADY_EXISTS
                - REASON_CODE_NOT_FOUND
                - REASON_CODE_INACTIVE
                - REASON_CODE_CATEGORY_MISMATCH
                - REASON_CODE_LAST_ACTIVE
                - REASON_CODE_PROTECTED
                - IDEMPOTENCY_KEY_REUSED
                - SETTINGS_UNAVAILABLE
            message: { type: string }
            request_id: { type: string, maxLength: 128 }

    StatusDocument:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }

    ErrorDocument:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

  responses:
    CloudUserPage:
      description: 仅含脱敏身份的 Cloud 用户页
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudUserPage' }
    CloudUser:
      description: 一个仅含脱敏身份的 Cloud 用户
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudUser' }
    CloudDevicePage:
      description: Cloud 设备页
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudDevicePage' }
    CloudSessionPage:
      description: Cloud 会话页
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudSessionPage' }
    AdminOperation:
      description: 已接受或当前管理员操作状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminOperation' }
    ApprovalRequest:
      description: 审批申请及其安全快照
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalRequest' }
    ApprovalPage:
      description: 审批申请页
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalPage' }
    AuditEventPage:
      description: 按权限数据范围过滤后的安全审计记录页
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuditEventPage' }
    SecurityPolicy:
      description: 当前管理员安全策略及乐观锁版本
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SecurityPolicy' }
    SecurityPolicyMutation:
      description: 更新后的策略；会话时长变化时 `sessions_revoked` 为 true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SecurityPolicyMutationResult' }
    ReasonCodePage:
      description: 按调用者数据范围过滤后的原因码目录
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReasonCodePage' }
    ReasonCodeMutation:
      description: 创建或更新后的原因码与全局设置版本
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReasonCodeMutationResult' }
    SystemHealth:
      description: 不包含内部地址或凭据的依赖健康状态
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SystemHealth' }
    CloudUnavailable:
      description: Cloud 依赖未配置、不可用或不符合安全契约
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CloudControlErrorDocument' }
    NotFound:
      description: 目标不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
    SessionEstablished:
      description: 管理员会话已建立
      headers:
        Set-Cookie:
          description: "`__Host-aera_admin_session` Secure、HttpOnly、SameSite=Strict Cookie"
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionDocument'
    StatusOK:
      description: 操作完成
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusDocument'
    InvalidRequest:
      description: 严格 JSON 或字段校验失败
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: INVALID_REQUEST, message: 请求内容无效 } }
    InvalidCredentials:
      description: 管理员凭证无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: AUTH_INVALID_CREDENTIALS, message: 管理员凭证无效 } }
    AuthRequired:
      description: 需要有效管理员会话
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: AUTH_REQUIRED, message: 需要有效的管理员会话 } }
    StepUpUnauthorized:
      description: 管理员会话无效，或 TOTP 凭证无效、过期或被重放
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          examples:
            authRequired:
              value: { error: { code: AUTH_REQUIRED, message: 需要有效的管理员会话 } }
            invalidCredentials:
              value: { error: { code: AUTH_INVALID_CREDENTIALS, message: 管理员凭证无效 } }
    Forbidden:
      description: Origin、CSRF、角色权限或 Step-up 不满足
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
    ActivationInvalid:
      description: 激活令牌、密码或 TOTP 无效或已过期
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: ACTIVATION_INVALID, message: 激活信息无效或已过期 } }
    RateLimited:
      description: 原子 account/session 或 IP 尝试限制已生效
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1, maximum: 900 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: RATE_LIMITED, message: 尝试过于频繁，请稍后重试 } }
    AdministratorNotFound:
      description: 目标管理员不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
    StateConflict:
      description: 身份已存在、管理员状态冲突、自我管理或最小超级管理员约束
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
    SettingsPolicyInvalid:
      description: 会话策略边界、策略间约束或审计保留期限无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SettingsErrorDocument' }
          example: { error: { code: SETTINGS_POLICY_INVALID, message: 安全策略参数无效 } }
    SettingsConflict:
      description: 设置版本、幂等键或原因目录状态冲突
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SettingsErrorDocument' }
          examples:
            revision: { value: { error: { code: SETTINGS_REVISION_CONFLICT, message: 设置版本已变化，请刷新后重试 } } }
            idempotency: { value: { error: { code: IDEMPOTENCY_KEY_REUSED, message: 幂等键已用于其他请求 } } }
            exists: { value: { error: { code: REASON_CODE_ALREADY_EXISTS, message: 原因码已存在 } } }
            inactive: { value: { error: { code: REASON_CODE_INACTIVE, message: 原因码已停用 } } }
            category: { value: { error: { code: REASON_CODE_CATEGORY_MISMATCH, message: 原因码不适用于此操作 } } }
            lastActive: { value: { error: { code: REASON_CODE_LAST_ACTIVE, message: 每个分类必须保留至少一个有效原因码 } } }
            protected: { value: { error: { code: REASON_CODE_PROTECTED, message: 受保护原因码不能停用 } } }
    ReasonCodeNotFound:
      description: 原因码不存在
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SettingsErrorDocument' }
          example: { error: { code: REASON_CODE_NOT_FOUND, message: 原因码不存在 } }
    SettingsUnavailable:
      description: 设置、原因目录、PostgreSQL 或审计依赖不可用；请求失败关闭
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SettingsErrorDocument' }
          example: { error: { code: SETTINGS_UNAVAILABLE, message: 系统设置服务暂时不可用 } }
    InternalError:
      description: 未归类的内部处理失败；响应不暴露内部错误细节
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: INTERNAL_ERROR, message: 服务暂时不可用 } }
    AuthUnavailable:
      description: 认证、审计、PostgreSQL 或 Redis 不可用；系统失败关闭
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: AUTH_UNAVAILABLE, message: 认证服务暂时不可用 } }
    AuditUnavailable:
      description: 审计查询或查询行为审计不可用；请求失败关闭
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorDocument' }
          example: { error: { code: AUDIT_UNAVAILABLE, message: 审计服务暂时不可用 } }
